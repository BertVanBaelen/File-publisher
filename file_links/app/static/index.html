<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #f3f5f2;
    --surface: #ffffff;
    --ink: #1d2521;
    --muted: #5e6a63;
    --line: #d6ddd8;
    --sign: #006b3f;
    --sign-ink: #ffffff;
    --danger: #b3261e;
    --focus: #e0a800;
    --font: "Overpass", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #14191a;
      --surface: #1c2325;
      --ink: #e6ece8;
      --muted: #9aa7a0;
      --line: #2e3a37;
      --sign: #0f7a50;
      --danger: #f2817a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 16px/1.5 var(--font);
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 36px; }
  h1 { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 20px; font-weight: 800; margin: 40px 0 14px; }
  .domain { color: var(--muted); }
  .domain a { color: inherit; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* The road-sign plate: the one bold thing on the page */
  .plate {
    display: inline-block; background: var(--sign); color: var(--sign-ink);
    font-weight: 800; font-size: 18px; line-height: 1; letter-spacing: 0.01em;
    padding: 9px 14px 7px; border-radius: 7px;
    box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 4px var(--sign-ink);
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; justify-self: start;
  }
  .plate.missing { background: var(--danger); box-shadow: inset 0 0 0 2px var(--danger), inset 0 0 0 4px var(--sign-ink); }

  .rows { border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; gap: 16px;
    align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .row .file { min-width: 0; }
  .row .file strong { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .file span { color: var(--muted); font-size: 14px; }
  .row .file .warn { color: var(--danger); }
  .actions { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: flex-end; }
  .empty { color: var(--muted); padding: 18px 0; border-bottom: 1px solid var(--line); }

  button, .btn {
    font: 600 15px/1 var(--font); cursor: pointer; text-decoration: none;
    border-radius: 6px; padding: 11px 16px 9px; border: 1px solid transparent;
  }
  .link { font: 600 15px/1 var(--font); background: none; border: none; padding: 4px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .link:hover { text-decoration-color: currentColor; }
  .link.danger { color: var(--danger); }
  .primary { background: var(--ink); color: var(--paper); }
  .secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
  .pathfield { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); overflow: hidden; }
  .pathfield span { padding: 10px 2px 8px 12px; color: var(--muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 70%; }
  input[type=text], select {
    font: 400 16px/1.3 var(--font); color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 8px; width: 100%; min-width: 0;
  }
  .pathfield input { flex: 1 1 6em; width: auto; min-width: 6em; border: none; border-radius: 0; padding-left: 0; }
  .pathfield:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .pathfield input:focus-visible { outline: none; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 400; }
  .check input { width: 18px; height: 18px; accent-color: var(--sign); }
  .formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }

  .drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 26px 20px; text-align: center;
    color: var(--muted); margin-bottom: 14px; background: var(--surface);
  }
  .drop.over { border-color: var(--sign); color: var(--ink); }
  .drop button { margin-top: 10px; }

  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .frow strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .frow .meta { color: var(--muted); font-size: 14px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: var(--paper); padding: 12px 18px 10px; border-radius: 8px;
    font-weight: 600; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 40px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--danger); color: #fff; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  @media (max-width: 600px) {
    .row { grid-template-columns: 1fr; gap: 8px; }
    .actions { justify-content: flex-start; }
    .formrow { grid-template-columns: 1fr; }
    .frow { grid-template-columns: 1fr auto; }
    .frow .meta { grid-column: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>File Links</h1>
    <div class="domain" id="domain"></div>
  </header>

  <section aria-labelledby="links-h">
    <h2 id="links-h">Links</h2>
    <div class="rows" id="links"></div>
  </section>

  <section aria-labelledby="form-h">
    <h2 id="form-h">Add a link</h2>
    <form id="form">
      <div class="formrow">
        <label>Path
          <div class="pathfield"><span id="prefix">/</span><input type="text" id="path" placeholder="resume" autocomplete="off" spellcheck="false"></div>
        </label>
        <label>File
          <select id="file" required></select>
        </label>
      </div>
      <label class="check"><input type="checkbox" id="download"> Download the file instead of showing it in the browser</label>
      <div class="buttons">
        <button type="submit" class="primary" id="save">Save link</button>
        <button type="button" class="secondary" id="cancel" hidden>Cancel editing</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="files-h">
    <h2 id="files-h">Files</h2>
    <p class="hint">Uploading a file with the same name replaces it, and its links keep working.</p>
    <div class="drop" id="drop">
      Drop files here
      <div><button type="button" class="secondary" id="pick">Choose files</button></div>
      <input type="file" id="picker" multiple hidden>
    </div>
    <div class="rows" id="files"></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
let state = { links: [], files: [], public_url: "" };
let editing = null;
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function size(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function host() { return state.public_url.replace(/^https?:\/\//, ""); }
function fullUrl(path) { return state.public_url ? state.public_url + path : null; }

let toastTimer;
function toast(msg, isError) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), isError ? 5000 : 2200);
}

async function api(method, url, body, isFile) {
  const opts = { method };
  if (body !== undefined) {
    opts.body = isFile ? body : JSON.stringify(body);
    if (!isFile) opts.headers = { "Content-Type": "application/json" };
  }
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ").");
  state = data;
  render();
  return data;
}

function render() {
  $("domain").innerHTML = state.public_url
    ? '<a href="' + esc(state.public_url) + '" target="_blank" rel="noopener">' + esc(host()) + "</a>"
    : "Set your public URL in the add-on’s Configuration tab to get copyable links.";
  $("prefix").textContent = (host() || "") + "/";

  const links = $("links");
  links.innerHTML = state.links.length ? state.links.map((l) => `
    <div class="row">
      <span class="plate${l.missing ? " missing" : ""}" title="${esc(l.path)}">${esc(l.path)}</span>
      <div class="file">
        <strong title="${esc(l.file)}">${esc(l.file)}</strong>
        ${l.missing ? '<span class="warn">This file is gone. Upload it again or point the link at another file.</span>'
                    : "<span>" + (l.download ? "Downloads" : "Opens in the browser") + "</span>"}
      </div>
      <div class="actions">
        ${fullUrl(l.path) ? `<button class="link" data-copy="${esc(l.path)}">Copy link</button>
        <a class="link" href="${esc(fullUrl(l.path))}" target="_blank" rel="noopener">Open</a>` : ""}
        <button class="link" data-edit="${esc(l.path)}">Edit</button>
        <button class="link danger" data-remove="${esc(l.path)}">Remove</button>
      </div>
    </div>`).join("")
    : '<div class="empty">No links yet. Upload a file below, then give it a path.</div>';

  const sel = $("file"), keep = sel.value;
  sel.innerHTML = state.files.length
    ? state.files.map((f) => `<option value="${esc(f.name)}">${esc(f.name)}</option>`).join("")
    : '<option value="" disabled selected>Upload a file first</option>';
  if (state.files.some((f) => f.name === keep)) sel.value = keep;

  $("files").innerHTML = state.files.length ? state.files.map((f) => `
    <div class="frow">
      <div><strong title="${esc(f.name)}">${esc(f.name)}</strong></div>
      <div class="meta">${size(f.size)}${f.used_by.length ? ", used by " + f.used_by.map(esc).join(", ") : ""}</div>
      <button class="link danger" data-delete="${esc(f.name)}">Delete</button>
    </div>`).join("")
    : '<div class="empty">No files yet.</div>';
}

function resetForm() {
  editing = null;
  $("form").reset();
  $("form-h").textContent = "Add a link";
  $("save").textContent = "Save link";
  $("cancel").hidden = true;
  render();
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const path = "/" + $("path").value.trim().replace(/^\/+|\/+$/g, "");
  if (state.links.some((l) => l.path === path && l.path !== editing) &&
      !confirm(path + " already points to a file. Replace it?")) return;
  try {
    await api("POST", "api/links", { path, file: $("file").value, download: $("download").checked, old_path: editing });
    toast("Saved " + path);
    resetForm();
  } catch (err) { toast(err.message, true); }
});
$("cancel").addEventListener("click", resetForm);

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  try {
    if (t.dataset.copy) {
      await navigator.clipboard.writeText(fullUrl(t.dataset.copy));
      toast("Copied " + fullUrl(t.dataset.copy));
    } else if (t.dataset.edit) {
      const l = state.links.find((x) => x.path === t.dataset.edit);
      editing = l.path;
      $("path").value = l.path.replace(/^\//, "");
      $("file").value = l.file;
      $("download").checked = l.download;
      $("form-h").textContent = "Edit " + l.path;
      $("cancel").hidden = false;
      $("form").scrollIntoView({ behavior: "smooth", block: "center" });
      $("path").focus();
    } else if (t.dataset.remove) {
      if (!confirm("Remove the link " + t.dataset.remove + "? The file stays.")) return;
      await api("DELETE", "api/links?path=" + encodeURIComponent(t.dataset.remove));
      if (editing === t.dataset.remove) resetForm();
      toast("Removed " + t.dataset.remove);
    } else if (t.dataset.delete) {
      if (!confirm("Delete " + t.dataset.delete + "?")) return;
      await api("DELETE", "api/files?name=" + encodeURIComponent(t.dataset.delete));
      toast("Deleted " + t.dataset.delete);
    }
  } catch (err) { toast(err.message, true); }
});

async function upload(files) {
  for (const f of files) {
    try {
      toast("Uploading " + f.name + "…");
      await api("PUT", "api/files?name=" + encodeURIComponent(f.name), f, true);
      $("file").value = f.name;
      toast("Uploaded " + f.name);
    } catch (err) { toast(err.message, true); }
  }
}
$("pick").addEventListener("click", () => $("picker").click());
$("picker").addEventListener("change", (e) => { upload([...e.target.files]); e.target.value = ""; });
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => upload([...e.dataTransfer.files]));

fetch("api/state").then((r) => r.json()).then((d) => { state = d; render(); })
  .catch(() => toast("Couldn’t load your links. Check the add-on’s Log tab.", true));
</script>
</body>
</html>
